<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preguntados - Convivir, Participar y Transformar</title>
<style>
:root{--navy:#173b58;--paper:#f6f8fc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#eaf5ff,#fff7e8);color:#172b43}
header{background:var(--navy);color:white;padding:18px 14px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.logo{width:82px;height:82px;object-fit:contain;background:white;border-radius:50%;padding:4px}
h1{margin:4px 0;font-size:clamp(1.5rem,4vw,2.5rem)}
header p{margin:4px}
header p.jornada{color:white;font-weight:700;font-size:1.1rem;margin-top:6px}
main{max-width:1050px;margin:22px auto;padding:0 14px}
.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 25px #16365318;margin-bottom:16px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:10px;max-width:100%}
.score{font-weight:800;color:#173b58;font-size:1.2rem}
.game{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);gap:20px;align-items:center}
@media(max-width:720px){.game{grid-template-columns:1fr}}
.wheel-wrap{display:grid;place-items:center;gap:12px}
canvas{width:min( min(78vw,390px),100%);height:auto;max-width:390px}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:750;font-size:1rem;cursor:pointer;background:#173b58;color:white}
button:disabled{opacity:.45;cursor:not-allowed}.spin{background:#f5b82e;color:#17304b;font-size:1.1rem}
.options{display:grid;gap:10px;margin-top:14px}
.option{background:#f3f6fa;color:#17304b;border:2px solid #dce5ef;text-align:left}
.option.correct{border-color:#21965b;background:#e8f8ee}.option.wrong{border-color:#d84b4b;background:#fff0f0}
.category{font-weight:800;letter-spacing:.04em}.question{font-size:1.25rem;font-weight:750;line-height:1.35}
.feedback{padding:12px;border-radius:12px;background:#eef5fb;margin-top:12px}
.small{color:#60738a;font-size:.92rem}.hidden{display:none}
footer{text-align:center;color:#173b58;font-weight:700;font-size:1rem;padding:18px;background:white;border-radius:15px;margin:20px 14px 30px;box-shadow:0 4px 15px #16365310}
</style>
</head>
<body>
<header>
<div class="brand">
<img class="logo" src="LOGO EES1 SIN FONDO.png" alt="Escuela Secundaria N° 1 Lucio V. Mansilla">
<div>
<h1>PREGUNTADOS</h1>
<p><b>Convivir, Participar y Transformar</b></p>
<p>Nuestra voz cuenta, nuestras acciones transforman</p>
<p class="jornada">Convivencia escolar y participación estudiantil</p>
</div>
</div>
</header>
<main>
<section class="panel top">
<div><label for="team"><b>Equipo:</b></label> <input id="team" value="Equipo 1" maxlength="35"></div>
<div class="score">Puntaje: <span id="score">0</span></div>
</section>
<section class="panel game">
<div class="wheel-wrap">
<canvas id="wheel" width="600" height="600" aria-label="Ruleta de categorías"></canvas>
<button class="spin" id="spin">🎯 GIRAR LA RULETA</button>
<div class="small" id="wheelMsg">Girá la ruleta para elegir una categoría</div>
</div>
<div>
<div class="category" id="category">¡Bienvenidos!</div>
<div class="question" id="question">Girá la ruleta y preparate para responder.</div>
<div class="options" id="options"></div>
